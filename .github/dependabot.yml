# Weekly dependency update PRs, all targeting develop so they go through CI.
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch updates; majors get their own PRs.
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Postgres and Flyway images in backend/docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly

  # The actions used by the workflows (they are pinned to commit SHAs).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
